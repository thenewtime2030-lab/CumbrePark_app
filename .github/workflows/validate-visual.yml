name: CumbrePark - Validar diseño visual

on:
  push:
    branches: [feature/hevy-minimal-liverpool-red]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Probar funcionalidades y compilar preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar el código y la PWA
        run: npm run check
      - name: Conservar web compilada para revisión (no publicar)
        uses: actions/upload-artifact@v4
        with:
          name: CumbrePark-Hevy-Red-Preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
