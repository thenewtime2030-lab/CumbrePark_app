name: CumbrePark - Probar, construir y publicar PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Tests y build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas y compilación de artefactos
        run: npm run check
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir aplicación compilada
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar CumbrePark
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar PWA
        id: deployment
        uses: actions/deploy-pages@v4
